<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Modal | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 20, 25, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-container {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: slideUp 0.3s ease, shake 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        .modal-body {
            padding: 40px 32px;
            text-align: center;
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: var(--color-coral-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s ease;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .error-icon {
            width: 40px;
            height: 40px;
            position: relative;
            animation: errorDraw 0.5s 0.2s ease forwards;
        }

        @keyframes errorDraw {
            from {
                transform: scale(0) rotate(-45deg);
            }
            to {
                transform: scale(1) rotate(0);
            }
        }

        .error-icon svg {
            stroke: var(--color-coral);
            stroke-width: 3;
            stroke-linecap: round;
            fill: none;
        }

        .error-line {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: dash 0.3s 0.3s ease forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--color-midnight);
            margin-bottom: 12px;
        }

        .modal-description {
            font-size: 15px;
            color: var(--color-slate);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .error-code {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--color-coral-bg);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: var(--color-coral);
            font-family: 'Courier New', monospace;
            margin-bottom: 24px;
        }

        .modal-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-danger {
            background: var(--color-coral);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-slate);
            border: none;
        }

        .btn-secondary:hover {
            color: var(--color-charcoal);
        }

        .support-link {
            font-size: 13px;
            color: var(--color-primary);
            text-decoration: none;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .support-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .modal-body {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-body">
                <div class="modal-icon">
                    <div class="error-icon">
                        <svg width="40" height="40" viewBox="0 0 40 40">
                            <line class="error-line" x1="10" y1="10" x2="30" y2="30"/>
                            <line class="error-line" x1="30" y1="10" x2="10" y2="30"/>
                        </svg>
                    </div>
                </div>
                <h2 class="modal-title">Payment Failed</h2>
                <p class="modal-description">
                    We couldn't process your payment. Your card was declined by the issuing bank. Please check your card details or try a different payment method.
                </p>
                <div class="error-code">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    ERROR: CARD_DECLINED_INSUFFICIENT_FUNDS
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/>
                        </svg>
                        Try Again
                    </button>
                    <button class="btn btn-secondary">Use Different Method</button>
                    <a href="#" class="support-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        Contact Support
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Close modal on overlay click
        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                console.log('Close modal');
            }
        });

        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                console.log('Close modal');
            }
        });

        // Button click handlers
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                console.log('Button clicked:', this.textContent);
            });
        });

        // Support link handler
        document.querySelector('.support-link').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Open support');
        });
    </script>
</body>
</html>
