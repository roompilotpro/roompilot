<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Photos | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            padding: 40px;
        }

        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .demo-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            color: var(--color-midnight);
            margin-bottom: 8px;
        }

        .demo-description {
            font-size: 16px;
            color: var(--color-mist);
        }

        .demo-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-trigger:hover {
            background: var(--color-primary-dark);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 25, 0.95);
            z-index: 9999;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .photo-viewer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .viewer-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .viewer-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--color-warm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .viewer-title-text h3 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .viewer-title-text p {
            font-size: 13px;
            opacity: 0.8;
        }

        .viewer-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .viewer-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .viewer-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .viewer-btn.close {
            background: var(--color-coral);
            border-color: transparent;
        }

        .viewer-btn.close:hover {
            background: #e11d48;
        }

        .viewer-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .photo-container {
            max-width: 90%;
            max-height: 100%;
            position: relative;
        }

        .photo-image {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            color: var(--color-charcoal);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-lg);
        }

        .nav-btn:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }

        .nav-btn.prev {
            left: 32px;
        }

        .nav-btn.next {
            right: 32px;
        }

        .viewer-footer {
            padding: 24px 28px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .photo-metadata {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 16px;
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .metadata-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .photo-counter {
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-align: center;
        }

        .photo-thumbnails {
            display: flex;
            gap: 10px;
            justify-content: center;
            overflow-x: auto;
            padding: 12px 0;
        }

        .thumbnail {
            width: 70px;
            height: 70px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .thumbnail:hover {
            border-color: rgba(255, 255, 255, 0.5);
        }

        .thumbnail.active {
            border-color: white;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .placeholder-image.img-1 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); font-size: 48px; }
        .placeholder-image.img-2 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); font-size: 48px; }
        .placeholder-image.img-3 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); font-size: 48px; }
        .placeholder-image.img-4 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); font-size: 48px; }
        .placeholder-image.img-5 { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); font-size: 48px; }

        @media (max-width: 768px) {
            .viewer-header,
            .viewer-footer {
                padding: 16px 20px;
            }

            .viewer-main {
                padding: 20px;
            }

            .nav-btn {
                width: 44px;
                height: 44px;
            }

            .nav-btn.prev {
                left: 16px;
            }

            .nav-btn.next {
                right: 16px;
            }

            .photo-metadata {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .thumbnail {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1 class="demo-title">Maintenance Photos Modal</h1>
            <p class="demo-description">Full-screen viewer for maintenance request photos</p>
        </div>

        <div style="text-align: center;">
            <button class="demo-trigger" onclick="openViewer()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                View Maintenance Photos
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="photoViewer">
        <div class="photo-viewer">
            <div class="viewer-header">
                <div class="viewer-title">
                    <div class="viewer-icon">🔧</div>
                    <div class="viewer-title-text">
                        <h3>AC not cooling properly</h3>
                        <p>Request #1247 • Room 2</p>
                    </div>
                </div>
                <div class="viewer-actions">
                    <button class="viewer-btn" title="Download" onclick="downloadPhoto()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                    </button>
                    <button class="viewer-btn close" title="Close" onclick="closeViewer()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="viewer-main">
                <button class="nav-btn prev" onclick="prevPhoto()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>

                <div class="photo-container">
                    <div class="photo-image placeholder-image img-2" id="mainPhoto">
                        💨
                    </div>
                </div>

                <button class="nav-btn next" onclick="nextPhoto()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>

            <div class="viewer-footer">
                <div class="photo-metadata">
                    <div class="metadata-item">
                        <div class="metadata-icon">📅</div>
                        <span id="photoDate">Taken: Nov 28, 2024 at 3:42 PM</span>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-icon">👤</div>
                        <span id="photoSubmitter">Submitted by: Sarah Thompson</span>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-icon">📍</div>
                        <span>Midtown Modern House</span>
                    </div>
                </div>

                <div class="photo-counter" id="photoCounter">2 of 5</div>

                <div class="photo-thumbnails" id="thumbnails">
                    <!-- Thumbnails will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const photos = [
            { id: 1, icon: '🌡️', class: 'img-1', date: 'Nov 28, 2024 at 3:40 PM', submitter: 'Sarah Thompson' },
            { id: 2, icon: '💨', class: 'img-2', date: 'Nov 28, 2024 at 3:42 PM', submitter: 'Sarah Thompson' },
            { id: 3, icon: '🔌', class: 'img-3', date: 'Nov 28, 2024 at 3:45 PM', submitter: 'Sarah Thompson' },
            { id: 4, icon: '⚠️', class: 'img-4', date: 'Nov 28, 2024 at 3:47 PM', submitter: 'Sarah Thompson' },
            { id: 5, icon: '📊', class: 'img-5', date: 'Nov 28, 2024 at 3:50 PM', submitter: 'Sarah Thompson' }
        ];

        let currentPhotoIndex = 1; // Starting at photo 2

        function initViewer() {
            const thumbnailsContainer = document.getElementById('thumbnails');
            thumbnailsContainer.innerHTML = '';

            photos.forEach((photo, index) => {
                const thumbnail = document.createElement('div');
                thumbnail.className = `thumbnail ${index === currentPhotoIndex ? 'active' : ''}`;
                thumbnail.onclick = () => goToPhoto(index);

                const thumbImg = document.createElement('div');
                thumbImg.className = `placeholder-image ${photo.class}`;
                thumbImg.style.width = '100%';
                thumbImg.style.height = '100%';
                thumbImg.textContent = photo.icon;
                thumbImg.style.fontSize = '28px';

                thumbnail.appendChild(thumbImg);
                thumbnailsContainer.appendChild(thumbnail);
            });

            updateViewer();
        }

        function openViewer() {
            document.getElementById('photoViewer').classList.add('active');
            document.body.style.overflow = 'hidden';
            initViewer();
        }

        function closeViewer() {
            document.getElementById('photoViewer').classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateViewer() {
            const photo = photos[currentPhotoIndex];

            // Update main photo
            const mainPhoto = document.getElementById('mainPhoto');
            mainPhoto.className = `photo-image placeholder-image ${photo.class}`;
            mainPhoto.textContent = photo.icon;

            // Update metadata
            document.getElementById('photoDate').textContent = `Taken: ${photo.date}`;
            document.getElementById('photoSubmitter').textContent = `Submitted by: ${photo.submitter}`;

            // Update counter
            document.getElementById('photoCounter').textContent = `${currentPhotoIndex + 1} of ${photos.length}`;

            // Update active thumbnail
            document.querySelectorAll('.thumbnail').forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentPhotoIndex);
            });

            // Scroll active thumbnail into view
            const activeThumbnail = document.querySelector('.thumbnail.active');
            if (activeThumbnail) {
                activeThumbnail.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function nextPhoto() {
            currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
            updateViewer();
        }

        function prevPhoto() {
            currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
            updateViewer();
        }

        function goToPhoto(index) {
            currentPhotoIndex = index;
            updateViewer();
        }

        function downloadPhoto() {
            alert('Download functionality would download the current photo');
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('photoViewer').classList.contains('active')) return;

            if (e.key === 'ArrowLeft') {
                prevPhoto();
            } else if (e.key === 'ArrowRight') {
                nextPhoto();
            } else if (e.key === 'Escape') {
                closeViewer();
            }
        });

        // Close on backdrop click
        document.getElementById('photoViewer').addEventListener('click', (e) => {
            if (e.target.id === 'photoViewer') {
                closeViewer();
            }
        });
    </script>
</body>
</html>
