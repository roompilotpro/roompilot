<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;
            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;
            --color-accent: #10b981;
            --color-accent-bg: #ecfdf5;
            --color-warm: #f59e0b;
            --color-coral: #f43f5e;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--color-snow) 0%, var(--color-cloud) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--color-midnight);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            text-align: center;
            display: block;
            margin-bottom: 2rem;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--color-primary-bg);
            color: var(--color-primary);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: center;
        }

        .role-badge.host {
            background: var(--color-accent-bg);
            color: var(--color-accent);
        }

        .form-card {
            background: var(--color-white);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 6px rgba(15, 20, 25, 0.1), 0 2px 4px rgba(15, 20, 25, 0.06);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--color-midnight);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--color-slate);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            background: var(--color-white);
            border: 2px solid var(--color-cloud);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-midnight);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .oauth-btn:hover {
            border-color: var(--color-slate);
            background: var(--color-snow);
        }

        .oauth-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--color-mist);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-cloud);
        }

        .divider span {
            padding: 0 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--color-midnight);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--color-cloud);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--color-white);
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-bg);
        }

        input.error {
            border-color: var(--color-coral);
        }

        input.success {
            border-color: var(--color-accent);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-mist);
            font-size: 1.25rem;
        }

        .password-strength {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.25rem;
            height: 4px;
        }

        .strength-bar {
            flex: 1;
            background: var(--color-cloud);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-bar.active.weak {
            background: var(--color-coral);
        }

        .strength-bar.active.medium {
            background: var(--color-warm);
        }

        .strength-bar.active.strong {
            background: var(--color-accent);
        }

        .strength-text {
            font-size: 0.75rem;
            margin-top: 0.25rem;
            color: var(--color-mist);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-top: 0.25rem;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 400;
            color: var(--color-slate);
            font-size: 0.875rem;
            flex: 1;
        }

        .checkbox-group a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary);
            color: var(--color-white);
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: var(--color-mist);
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--color-slate);
        }

        .login-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            font-size: 0.75rem;
            color: var(--color-coral);
            margin-top: 0.25rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .form-card {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="auth-signup.html" class="logo">RoomPilot</a>

        <div class="role-badge" id="roleBadge">
            <span>🏠</span>
            <span>Signing up as a Renter</span>
        </div>

        <div class="form-card">
            <h1>Create your account</h1>
            <p class="subtitle">Start your journey to finding the perfect room</p>

            <div class="oauth-buttons">
                <button class="oauth-btn" onclick="signupWithProvider('google')">
                    <svg class="oauth-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="oauth-btn" onclick="signupWithProvider('apple')">
                    <svg class="oauth-icon" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="currentColor"/>
                    </svg>
                    Continue with Apple
                </button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="signupForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required>
                    <div class="error-message" id="nameError">Please enter your full name</div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError">Please enter a valid email address</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required oninput="checkPasswordStrength()">
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">👁</button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strength1"></div>
                        <div class="strength-bar" id="strength2"></div>
                        <div class="strength-bar" id="strength3"></div>
                        <div class="strength-bar" id="strength4"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Use 8+ characters with mix of letters, numbers & symbols</div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
                    <div class="error-message" id="phoneError">Please enter a valid phone number</div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">
                            I agree to RoomPilot's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="auth-login.html">Log in</a>
            </div>
        </div>
    </div>

    <script>
        // Get role from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'renter';

        if (role === 'host') {
            document.getElementById('roleBadge').innerHTML = '<span>🔑</span><span>Signing up as a Host</span>';
            document.getElementById('roleBadge').classList.add('host');
            document.querySelector('.subtitle').textContent = 'Start listing your rooms and connecting with renters';
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const bars = [
                document.getElementById('strength1'),
                document.getElementById('strength2'),
                document.getElementById('strength3'),
                document.getElementById('strength4')
            ];
            const strengthText = document.getElementById('strengthText');

            // Reset
            bars.forEach(bar => {
                bar.classList.remove('active', 'weak', 'medium', 'strong');
            });

            if (password.length === 0) {
                strengthText.textContent = 'Use 8+ characters with mix of letters, numbers & symbols';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            let strengthLevel = 'weak';
            let strengthLabel = 'Weak password';

            if (strength >= 3) {
                strengthLevel = 'medium';
                strengthLabel = 'Good password';
            }
            if (strength === 4) {
                strengthLevel = 'strong';
                strengthLabel = 'Strong password';
            }

            for (let i = 0; i < strength; i++) {
                bars[i].classList.add('active', strengthLevel);
            }

            strengthText.textContent = strengthLabel;
        }

        function signupWithProvider(provider) {
            console.log(`Signing up with ${provider}`);
            // OAuth flow would be implemented here
            alert(`${provider} signup would be initiated here`);
        }

        function handleSubmit(event) {
            event.preventDefault();

            const formData = {
                role: role,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                termsAccepted: document.getElementById('terms').checked
            };

            console.log('Form submitted:', formData);

            // Redirect to onboarding based on role
            if (role === 'host') {
                window.location.href = 'onboarding-host.html';
            } else {
                window.location.href = 'onboarding-renter.html';
            }
        }
    </script>
</body>
</html>
