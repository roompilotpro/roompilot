<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Upload | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            padding: 40px;
        }

        /* Demo container */
        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .demo-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            color: var(--color-midnight);
            margin-bottom: 8px;
        }

        .demo-description {
            font-size: 16px;
            color: var(--color-mist);
        }

        .demo-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .demo-trigger:hover {
            background: var(--color-primary-dark);
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 25, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal-overlay.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* Modal Container */
        .modal-container {
            background: white;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 900px;
            box-shadow: var(--shadow-lg);
            margin: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal Header */
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px;
            border-bottom: 1px solid var(--color-cloud);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            color: var(--color-midnight);
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: none;
            border: none;
            color: var(--color-slate);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--color-snow);
            color: var(--color-charcoal);
        }

        /* Modal Body */
        .modal-body {
            padding: 28px;
        }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed var(--color-cloud);
            border-radius: var(--radius-lg);
            padding: 48px 32px;
            text-align: center;
            background: var(--color-snow);
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .drop-zone.drag-over {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .drop-zone-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--color-primary-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .drop-zone-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: 8px;
        }

        .drop-zone-text {
            font-size: 14px;
            color: var(--color-mist);
            margin-bottom: 16px;
        }

        .drop-zone-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-dark);
        }

        .btn-secondary {
            background: var(--color-snow);
            color: var(--color-charcoal);
            border: 1px solid var(--color-cloud);
        }

        .btn-secondary:hover {
            background: var(--color-cloud);
        }

        /* Upload Progress */
        .upload-progress {
            display: none;
            padding: 16px;
            background: var(--color-primary-bg);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .upload-progress.active {
            display: block;
        }

        .progress-text {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-primary-dark);
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--color-primary);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--color-snow);
            border: 2px solid var(--color-cloud);
            cursor: move;
        }

        .photo-item.cover {
            border-color: var(--color-accent);
        }

        .photo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 20, 25, 0.7);
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .photo-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: white;
            border: none;
            color: var(--color-charcoal);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .photo-btn:hover {
            transform: scale(1.1);
        }

        .photo-btn.delete {
            background: var(--color-coral);
            color: white;
        }

        .photo-btn.delete:hover {
            background: #e11d48;
        }

        .photo-cover-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--color-accent);
            color: white;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .photo-drag-handle {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            padding: 6px;
            cursor: move;
        }

        /* Info Section */
        .info-section {
            padding: 16px;
            background: var(--color-snow);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        .info-row + .info-row {
            margin-top: 8px;
        }

        .info-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-mist);
        }

        .info-text {
            color: var(--color-slate);
        }

        .info-text.warning {
            color: var(--color-warm);
            font-weight: 600;
        }

        /* Modal Footer */
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 28px;
            border-top: 1px solid var(--color-cloud);
            background: var(--color-snow);
        }

        .photo-count {
            font-size: 14px;
            color: var(--color-mist);
        }

        .photo-count.valid {
            color: var(--color-accent-dark);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn-ghost {
            background: none;
            color: var(--color-slate);
        }

        .btn-ghost:hover {
            background: var(--color-cloud);
        }

        .btn-accent {
            background: var(--color-accent);
            color: white;
        }

        .btn-accent:hover {
            background: var(--color-accent-dark);
        }

        .btn-accent:disabled {
            background: var(--color-cloud);
            color: var(--color-mist);
            cursor: not-allowed;
        }

        /* Placeholder images */
        .placeholder-image {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
        }

        .placeholder-image.img-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .placeholder-image.img-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .placeholder-image.img-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .placeholder-image.img-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .placeholder-image.img-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }

        /* Responsive */
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 20px;
            }

            .drop-zone {
                padding: 32px 20px;
            }

            .drop-zone-actions {
                flex-direction: column;
                width: 100%;
            }

            .drop-zone-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1 class="demo-title">Photo Upload Modal</h1>
            <p class="demo-description">Upload and manage property/room photos with drag-and-drop</p>
        </div>

        <div style="text-align: center;">
            <button class="demo-trigger" onclick="openModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Upload Photos
            </button>
        </div>
    </div>

    <!-- Photo Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-container">
            <!-- Header -->
            <div class="modal-header">
                <h2 class="modal-title">Upload Photos</h2>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <!-- Drop Zone -->
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-icon">📸</div>
                    <div class="drop-zone-title">Drag and drop your photos here</div>
                    <p class="drop-zone-text">or choose from your device</p>
                    <div class="drop-zone-actions">
                        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            Browse Files
                        </button>
                        <button class="btn btn-secondary" onclick="capturePhoto()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            Take Photo
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleFiles(this.files)">
                </div>

                <!-- Upload Progress -->
                <div class="upload-progress" id="uploadProgress">
                    <div class="progress-text">
                        <span>Uploading photos...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Photo Grid -->
                <div class="photo-grid" id="photoGrid">
                    <!-- Sample photos -->
                    <div class="photo-item cover" draggable="true">
                        <div class="photo-image placeholder-image img-1">🏠</div>
                        <div class="photo-cover-badge">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                            </svg>
                            Cover
                        </div>
                        <div class="photo-drag-handle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="12" x2="21" y2="12"/>
                                <line x1="3" y1="6" x2="21" y2="6"/>
                                <line x1="3" y1="18" x2="21" y2="18"/>
                            </svg>
                        </div>
                        <div class="photo-overlay">
                            <button class="photo-btn" onclick="setCover(event)" title="Set as cover">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                </svg>
                            </button>
                            <button class="photo-btn delete" onclick="deletePhoto(event)" title="Delete">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="photo-item" draggable="true">
                        <div class="photo-image placeholder-image img-2">🛏️</div>
                        <div class="photo-drag-handle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="12" x2="21" y2="12"/>
                                <line x1="3" y1="6" x2="21" y2="6"/>
                                <line x1="3" y1="18" x2="21" y2="18"/>
                            </svg>
                        </div>
                        <div class="photo-overlay">
                            <button class="photo-btn" onclick="setCover(event)" title="Set as cover">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                </svg>
                            </button>
                            <button class="photo-btn delete" onclick="deletePhoto(event)" title="Delete">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="photo-item" draggable="true">
                        <div class="photo-image placeholder-image img-3">🍳</div>
                        <div class="photo-drag-handle">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="12" x2="21" y2="12"/>
                                <line x1="3" y1="6" x2="21" y2="6"/>
                                <line x1="3" y1="18" x2="21" y2="18"/>
                            </svg>
                        </div>
                        <div class="photo-overlay">
                            <button class="photo-btn" onclick="setCover(event)" title="Set as cover">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                                </svg>
                            </button>
                            <button class="photo-btn delete" onclick="deletePhoto(event)" title="Delete">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Info Section -->
                <div class="info-section">
                    <div class="info-row">
                        <div class="info-icon">ℹ️</div>
                        <div class="info-text">Accepted formats: JPG, PNG (max 10MB each)</div>
                    </div>
                    <div class="info-row">
                        <div class="info-icon">⚠️</div>
                        <div class="info-text warning">Minimum 3 photos required</div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <div class="photo-count valid" id="photoCount">3 photos uploaded</div>
                <div class="btn-group">
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-accent" id="saveBtn">Save Photos</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let photoCount = 3;

        function openModal() {
            document.getElementById('uploadModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            updatePhotoCount();
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function updatePhotoCount() {
            const countEl = document.getElementById('photoCount');
            const saveBtn = document.getElementById('saveBtn');

            countEl.textContent = `${photoCount} photo${photoCount !== 1 ? 's' : ''} uploaded`;

            if (photoCount >= 3) {
                countEl.classList.add('valid');
                saveBtn.disabled = false;
            } else {
                countEl.classList.remove('valid');
                saveBtn.disabled = true;
            }
        }

        function handleFiles(files) {
            if (files.length === 0) return;

            // Show upload progress
            const progressEl = document.getElementById('uploadProgress');
            progressEl.classList.add('active');

            // Simulate upload progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('progressPercent').textContent = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        progressEl.classList.remove('active');
                        // Add new photos to grid
                        photoCount += files.length;
                        updatePhotoCount();
                    }, 500);
                }
            }, 200);
        }

        function capturePhoto() {
            alert('Camera capture would open on mobile devices');
        }

        function setCover(event) {
            event.stopPropagation();
            const photoItem = event.target.closest('.photo-item');

            // Remove cover from all items
            document.querySelectorAll('.photo-item').forEach(item => {
                item.classList.remove('cover');
                const badge = item.querySelector('.photo-cover-badge');
                if (badge) badge.remove();
            });

            // Add cover to clicked item
            photoItem.classList.add('cover');
            const badge = document.createElement('div');
            badge.className = 'photo-cover-badge';
            badge.innerHTML = `
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                Cover
            `;
            photoItem.appendChild(badge);
        }

        function deletePhoto(event) {
            event.stopPropagation();
            const photoItem = event.target.closest('.photo-item');
            photoItem.remove();
            photoCount--;
            updatePhotoCount();
        }

        // Drag and drop for drop zone
        const dropZone = document.getElementById('dropZone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        // Close on backdrop click
        document.getElementById('uploadModal').addEventListener('click', (e) => {
            if (e.target.id === 'uploadModal') {
                closeModal();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('uploadModal').classList.contains('active')) {
                closeModal();
            }
        });

        // Drag and drop for reordering photos
        let draggedItem = null;

        document.querySelectorAll('.photo-item').forEach(item => {
            item.addEventListener('dragstart', function() {
                draggedItem = this;
                setTimeout(() => this.style.opacity = '0.5', 0);
            });

            item.addEventListener('dragend', function() {
                setTimeout(() => this.style.opacity = '', 0);
                draggedItem = null;
            });

            item.addEventListener('dragover', function(e) {
                e.preventDefault();
            });

            item.addEventListener('drop', function(e) {
                e.preventDefault();
                if (draggedItem !== this) {
                    const grid = this.parentNode;
                    const items = [...grid.children];
                    const draggedIndex = items.indexOf(draggedItem);
                    const targetIndex = items.indexOf(this);

                    if (draggedIndex < targetIndex) {
                        this.parentNode.insertBefore(draggedItem, this.nextSibling);
                    } else {
                        this.parentNode.insertBefore(draggedItem, this);
                    }
                }
            });
        });
    </script>
</body>
</html>
