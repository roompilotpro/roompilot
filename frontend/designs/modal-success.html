<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Modal | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 20, 25, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-container {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-body {
            padding: 40px 32px;
            text-align: center;
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: var(--color-accent-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: checkmarkDraw 0.6s 0.2s ease forwards;
        }

        .checkmark svg {
            stroke: var(--color-accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .checkmark-path {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: dash 0.4s 0.3s ease forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes checkmarkDraw {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--color-midnight);
            margin-bottom: 12px;
        }

        .modal-description {
            font-size: 15px;
            color: var(--color-slate);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .modal-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--color-accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-accent-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-slate);
            border: none;
        }

        .btn-secondary:hover {
            color: var(--color-charcoal);
        }

        /* Auto-close countdown */
        .auto-close-text {
            font-size: 12px;
            color: var(--color-mist);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-body">
                <div class="modal-icon">
                    <div class="checkmark">
                        <svg width="48" height="48" viewBox="0 0 48 48">
                            <path class="checkmark-path" d="M14 24l8 8 16-16"/>
                        </svg>
                    </div>
                </div>
                <h2 class="modal-title">Application Approved!</h2>
                <p class="modal-description">
                    David Chen has been notified and will receive move-in details via email. Payment is due within 48 hours to secure the room.
                </p>
                <div class="modal-footer">
                    <button class="btn btn-primary">View Application</button>
                    <button class="btn btn-secondary">Done</button>
                </div>
                <p class="auto-close-text">This will close automatically in 5 seconds</p>
            </div>
        </div>
    </div>

    <script>
        // Auto-close countdown
        let countdown = 5;
        const autoCloseText = document.querySelector('.auto-close-text');

        const countdownInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                autoCloseText.textContent = `This will close automatically in ${countdown} second${countdown !== 1 ? 's' : ''}`;
            } else {
                clearInterval(countdownInterval);
                console.log('Auto-close modal');
                // In real implementation, this would close the modal
            }
        }, 1000);

        // Close modal on overlay click
        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                console.log('Close modal');
            }
        });

        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                console.log('Close modal');
            }
        });

        // Button click handlers
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                console.log('Button clicked:', this.textContent);
            });
        });
    </script>
</body>
</html>
