<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Funds | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            padding: 40px 20px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 25, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        /* Modal Container */
        .modal {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Modal Header */
        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--color-cloud);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            color: var(--color-midnight);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: none;
            border: none;
            color: var(--color-slate);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--color-snow);
            color: var(--color-charcoal);
        }

        /* Modal Body */
        .modal-body {
            padding: 28px;
            overflow-y: auto;
            flex: 1;
        }

        /* Current Balance */
        .balance-display {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: var(--radius-md);
            padding: 24px;
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }

        .balance-label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-family: var(--font-display);
            font-size: 36px;
            font-weight: 700;
        }

        /* Amount Selection */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: 16px;
        }

        .amount-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .amount-option {
            padding: 16px;
            border: 2px solid var(--color-cloud);
            border-radius: var(--radius-md);
            background: var(--color-white);
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--color-charcoal);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .amount-option:hover {
            border-color: var(--color-primary-light);
            background: var(--color-primary-bg);
        }

        .amount-option.selected {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
            color: var(--color-primary);
        }

        .amount-option.recommended {
            position: relative;
        }

        .amount-option.recommended::after {
            content: 'Popular';
            position: absolute;
            top: -8px;
            right: 12px;
            background: var(--color-accent);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Custom Amount */
        .custom-amount {
            margin-bottom: 28px;
        }

        .custom-amount-input {
            position: relative;
        }

        .custom-amount-input input {
            width: 100%;
            padding: 14px 14px 14px 32px;
            border: 2px solid var(--color-cloud);
            border-radius: var(--radius-md);
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--color-charcoal);
            transition: all 0.2s ease;
        }

        .custom-amount-input input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .currency-symbol {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--color-slate);
            pointer-events: none;
        }

        .amount-note {
            margin-top: 8px;
            font-size: 13px;
            color: var(--color-mist);
        }

        /* Payment Method */
        .payment-method-section {
            margin-bottom: 28px;
        }

        .payment-method-selector {
            border: 2px solid var(--color-cloud);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .payment-method-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--color-white);
        }

        .payment-method-option:not(:last-child) {
            border-bottom: 1px solid var(--color-cloud);
        }

        .payment-method-option:hover {
            background: var(--color-snow);
        }

        .payment-method-option.selected {
            background: var(--color-primary-bg);
        }

        .payment-method-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-cloud);
            border-radius: 50%;
            position: relative;
            transition: all 0.2s ease;
        }

        .payment-method-option.selected .payment-method-radio {
            border-color: var(--color-primary);
        }

        .payment-method-option.selected .payment-method-radio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--color-primary);
            border-radius: 50%;
        }

        .payment-method-icon {
            font-size: 24px;
        }

        .payment-method-info {
            flex: 1;
        }

        .payment-method-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-charcoal);
        }

        .payment-method-details {
            font-size: 13px;
            color: var(--color-mist);
        }

        .add-method-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
            text-decoration: none;
            cursor: pointer;
        }

        .add-method-link:hover {
            text-decoration: underline;
        }

        /* Summary Box */
        .summary-box {
            background: var(--color-accent-bg);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .summary-row.total {
            padding-top: 12px;
            margin-top: 12px;
            border-top: 2px solid var(--color-accent);
        }

        .summary-label {
            font-size: 14px;
            color: var(--color-slate);
        }

        .summary-label.total {
            font-size: 15px;
            font-weight: 700;
            color: var(--color-charcoal);
        }

        .summary-value {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--color-charcoal);
        }

        .summary-value.total {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-accent-dark);
        }

        /* Modal Footer */
        .modal-footer {
            padding: 20px 28px;
            border-top: 1px solid var(--color-cloud);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: var(--color-snow);
            color: var(--color-slate);
        }

        .btn-secondary:hover {
            background: var(--color-cloud);
            color: var(--color-charcoal);
        }

        .btn-primary {
            background: var(--color-accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-accent-dark);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 640px) {
            .amount-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal">
            <!-- Header -->
            <div class="modal-header">
                <h2 class="modal-title">Add Funds to Wallet</h2>
                <button class="modal-close" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <!-- Current Balance -->
                <div class="balance-display">
                    <div class="balance-label">Current Wallet Balance</div>
                    <div class="balance-amount">$45.00</div>
                </div>

                <!-- Amount Selection -->
                <div class="section-title">Select Amount</div>
                <div class="amount-options">
                    <button class="amount-option" data-amount="50">$50</button>
                    <button class="amount-option recommended" data-amount="100">$100</button>
                    <button class="amount-option" data-amount="200">$200</button>
                    <button class="amount-option" data-amount="500">$500</button>
                </div>

                <!-- Custom Amount -->
                <div class="custom-amount">
                    <div class="section-title">Or Enter Custom Amount</div>
                    <div class="custom-amount-input">
                        <span class="currency-symbol">$</span>
                        <input type="number" id="custom-amount" placeholder="0.00" min="10" step="1">
                    </div>
                    <p class="amount-note">Minimum amount: $10.00</p>
                </div>

                <!-- Payment Method -->
                <div class="payment-method-section">
                    <div class="section-title">Payment Method</div>
                    <div class="payment-method-selector">
                        <div class="payment-method-option selected">
                            <div class="payment-method-radio"></div>
                            <span class="payment-method-icon">💳</span>
                            <div class="payment-method-info">
                                <div class="payment-method-name">Visa ending in 4242</div>
                                <div class="payment-method-details">Expires 12/2026</div>
                            </div>
                        </div>
                        <div class="payment-method-option">
                            <div class="payment-method-radio"></div>
                            <span class="payment-method-icon">🏦</span>
                            <div class="payment-method-info">
                                <div class="payment-method-name">Bank Account</div>
                                <div class="payment-method-details">Chase ending in 1234</div>
                            </div>
                        </div>
                    </div>
                    <a href="#" class="add-method-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        Add new payment method
                    </a>
                </div>

                <!-- Summary -->
                <div class="summary-box">
                    <div class="summary-row">
                        <span class="summary-label">Amount to add</span>
                        <span class="summary-value" id="amount-display">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Processing fee</span>
                        <span class="summary-value">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span class="summary-label total">New balance</span>
                        <span class="summary-value total" id="new-balance">$45.00</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn btn-secondary">Cancel</button>
                <button class="btn btn-primary" id="add-funds-btn" disabled>Add Funds</button>
            </div>
        </div>
    </div>

    <script>
        const currentBalance = 45.00;
        let selectedAmount = 0;

        // Amount option selection
        document.querySelectorAll('.amount-option').forEach(option => {
            option.addEventListener('click', function() {
                // Clear custom input
                document.getElementById('custom-amount').value = '';

                // Update selection
                document.querySelectorAll('.amount-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');

                selectedAmount = parseFloat(this.getAttribute('data-amount'));
                updateSummary();
            });
        });

        // Custom amount input
        document.getElementById('custom-amount').addEventListener('input', function() {
            // Clear preset selections
            document.querySelectorAll('.amount-option').forEach(opt => opt.classList.remove('selected'));

            selectedAmount = parseFloat(this.value) || 0;
            updateSummary();
        });

        // Payment method selection
        document.querySelectorAll('.payment-method-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.payment-method-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        // Update summary
        function updateSummary() {
            const amountDisplay = document.getElementById('amount-display');
            const newBalance = document.getElementById('new-balance');
            const addFundsBtn = document.getElementById('add-funds-btn');

            amountDisplay.textContent = `$${selectedAmount.toFixed(2)}`;
            newBalance.textContent = `$${(currentBalance + selectedAmount).toFixed(2)}`;

            // Enable/disable button
            if (selectedAmount >= 10) {
                addFundsBtn.disabled = false;
            } else {
                addFundsBtn.disabled = true;
            }
        }

        // Close modal
        document.querySelector('.modal-close').addEventListener('click', function() {
            console.log('Modal closed');
        });

        document.querySelector('.btn-secondary').addEventListener('click', function() {
            console.log('Modal cancelled');
        });

        document.getElementById('add-funds-btn').addEventListener('click', function() {
            if (selectedAmount >= 10) {
                console.log('Adding funds:', selectedAmount);
            }
        });

        // Add method link
        document.querySelector('.add-method-link').addEventListener('click', function(e) {
            e.preventDefault();
            console.log('Opening add payment method modal');
        });
    </script>
</body>
</html>
