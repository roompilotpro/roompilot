<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Modal | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 20, 25, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-container {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-body {
            padding: 40px 32px;
            text-align: center;
        }

        /* Spinner */
        .spinner-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid var(--color-cloud);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner-dot {
            width: 12px;
            height: 12px;
            background: var(--color-primary);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            margin: -6px 0 0 -6px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            color: var(--color-midnight);
            margin-bottom: 8px;
        }

        .modal-description {
            font-size: 14px;
            color: var(--color-mist);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--color-cloud);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            animation: progressShine 2s ease-in-out infinite;
        }

        @keyframes progressShine {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
            100% {
                opacity: 1;
            }
        }

        .progress-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            display: flex;
            justify-content: space-between;
        }

        .progress-percentage {
            color: var(--color-slate);
        }

        /* Cancel Button */
        .modal-footer {
            display: flex;
            justify-content: center;
        }

        .btn-cancel {
            padding: 10px 24px;
            background: transparent;
            color: var(--color-slate);
            border: 1px solid var(--color-cloud);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: var(--color-snow);
            border-color: var(--color-slate);
            color: var(--color-charcoal);
        }

        /* Loading States */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: var(--color-mist);
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @media (max-width: 640px) {
            .modal-body {
                padding: 32px 24px;
            }

            .spinner-container {
                width: 64px;
                height: 64px;
            }

            .spinner {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-body">
                <!-- Spinner -->
                <div class="spinner-container">
                    <div class="spinner"></div>
                    <div class="spinner-dot"></div>
                </div>

                <h2 class="modal-title">
                    Processing payment
                    <span class="loading-dots">
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                    </span>
                </h2>
                <p class="modal-description">
                    Please don't close this window or press the back button
                </p>

                <!-- Progress Bar (Optional) -->
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 45%"></div>
                    </div>
                    <div class="progress-text">
                        <span>Verifying payment details</span>
                        <span class="progress-percentage" id="progressPercent">45%</span>
                    </div>
                </div>

                <!-- Cancel Button (Optional) -->
                <div class="modal-footer">
                    <button class="btn-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulate progress
        let progress = 45;
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');

        const progressInterval = setInterval(() => {
            if (progress < 95) {
                progress += Math.random() * 15;
                if (progress > 95) progress = 95;

                progressFill.style.width = progress + '%';
                progressPercent.textContent = Math.round(progress) + '%';

                // Update status message
                const messages = [
                    'Verifying payment details',
                    'Contacting payment processor',
                    'Confirming transaction',
                    'Finalizing payment'
                ];

                const messageIndex = Math.floor(progress / 25);
                if (messages[messageIndex]) {
                    document.querySelector('.progress-text span:first-child').textContent = messages[messageIndex];
                }
            } else {
                clearInterval(progressInterval);
                console.log('Process complete');
            }
        }, 800);

        // Cancel button handler
        document.querySelector('.btn-cancel').addEventListener('click', function() {
            clearInterval(progressInterval);
            console.log('Operation cancelled');
        });

        // Prevent closing during operation
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        });
    </script>
</body>
</html>
