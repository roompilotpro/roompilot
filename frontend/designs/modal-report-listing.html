<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Listing | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 25, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Modal Container */
        .modal-container {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal Header */
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 24px 20px;
            border-bottom: 1px solid var(--color-cloud);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            color: var(--color-midnight);
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: none;
            border: none;
            color: var(--color-slate);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--color-snow);
            color: var(--color-charcoal);
        }

        /* Modal Body */
        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        /* Info Banner */
        .info-banner {
            padding: 16px;
            background: var(--color-warm-bg);
            border-left: 4px solid var(--color-warm);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .info-text {
            font-size: 14px;
            color: var(--color-charcoal);
            line-height: 1.5;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: 8px;
        }

        .form-label-required {
            color: var(--color-coral);
        }

        .form-label-optional {
            font-size: 13px;
            font-weight: 400;
            color: var(--color-mist);
        }

        /* Radio Options */
        .radio-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--color-snow);
            border: 2px solid var(--color-cloud);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-option:hover {
            background: var(--color-cloud);
            border-color: var(--color-slate);
        }

        .radio-option.selected {
            background: var(--color-primary-bg);
            border-color: var(--color-primary);
        }

        .radio-input {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            cursor: pointer;
        }

        .radio-label {
            font-size: 15px;
            color: var(--color-charcoal);
            cursor: pointer;
            flex: 1;
        }

        /* Textarea */
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-cloud);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--color-charcoal);
            resize: vertical;
            min-height: 100px;
            transition: all 0.2s ease;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-bg);
        }

        /* File Upload */
        .file-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            border: 2px dashed var(--color-cloud);
            border-radius: var(--radius-md);
            background: var(--color-snow);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-upload:hover {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .file-upload-icon {
            width: 48px;
            height: 48px;
            background: var(--color-cloud);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .file-upload-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: 4px;
        }

        .file-upload-hint {
            font-size: 13px;
            color: var(--color-mist);
        }

        .file-input {
            display: none;
        }

        /* Uploaded Files */
        .uploaded-files {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .uploaded-file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--color-snow);
            border-radius: var(--radius-sm);
        }

        .file-icon {
            width: 32px;
            height: 32px;
            background: var(--color-primary-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-charcoal);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 12px;
            color: var(--color-mist);
        }

        .file-remove {
            width: 28px;
            height: 28px;
            background: none;
            border: none;
            color: var(--color-coral);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .file-remove:hover {
            background: var(--color-coral-bg);
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            background: var(--color-snow);
            border-radius: var(--radius-md);
        }

        .checkbox-input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--color-charcoal);
            line-height: 1.5;
        }

        /* Modal Footer */
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 24px;
            border-top: 1px solid var(--color-cloud);
        }

        .footer-note {
            font-size: 13px;
            color: var(--color-mist);
            flex: 1;
        }

        .footer-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: var(--color-snow);
            color: var(--color-slate);
            border: 1px solid var(--color-cloud);
        }

        .btn-secondary:hover {
            background: var(--color-cloud);
            color: var(--color-charcoal);
        }

        .btn-danger {
            background: var(--color-coral);
            color: white;
        }

        .btn-danger:hover {
            background: #e11d48;
        }

        .btn-danger:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .modal-container {
                max-width: 100%;
                max-height: 100vh;
                border-radius: 0;
            }

            .modal-header {
                padding: 20px 16px 16px;
            }

            .modal-body {
                padding: 16px;
            }

            .modal-footer {
                padding: 16px;
                flex-direction: column;
                align-items: stretch;
            }

            .footer-note {
                text-align: center;
                margin-bottom: 8px;
            }

            .footer-actions {
                width: 100%;
            }

            .footer-actions .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">Report Listing</h2>
                <button class="modal-close" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <!-- Info Banner -->
                <div class="info-banner">
                    <p class="info-text">Help us keep RoomPilot safe. Your report will be reviewed by our Trust & Safety team within 24 hours.</p>
                </div>

                <!-- Reason Selector -->
                <div class="form-group">
                    <label class="form-label">
                        Why are you reporting this listing? <span class="form-label-required">*</span>
                    </label>
                    <div class="radio-options">
                        <label class="radio-option">
                            <input type="radio" name="reason" value="inaccurate" class="radio-input" required>
                            <span class="radio-label">Inaccurate information</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="reason" value="scam" class="radio-input">
                            <span class="radio-label">Suspicious or scam listing</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="reason" value="discriminatory" class="radio-input">
                            <span class="radio-label">Discriminatory content</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="reason" value="inappropriate" class="radio-input">
                            <span class="radio-label">Inappropriate photos</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="reason" value="safety" class="radio-input">
                            <span class="radio-label">Safety concerns</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="reason" value="other" class="radio-input">
                            <span class="radio-label">Other</span>
                        </label>
                    </div>
                </div>

                <!-- Additional Details -->
                <div class="form-group">
                    <label class="form-label">
                        Additional details
                    </label>
                    <textarea
                        class="form-textarea"
                        placeholder="Please provide any additional information that would help us investigate this report..."
                    ></textarea>
                </div>

                <!-- Upload Evidence -->
                <div class="form-group">
                    <label class="form-label">
                        Upload evidence <span class="form-label-optional">(optional)</span>
                    </label>
                    <label class="file-upload" for="evidence-upload">
                        <div class="file-upload-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <div class="file-upload-text">Click to upload or drag and drop</div>
                        <div class="file-upload-hint">PNG, JPG, PDF up to 10MB</div>
                    </label>
                    <input type="file" id="evidence-upload" class="file-input" accept=".png,.jpg,.jpeg,.pdf" multiple>

                    <div class="uploaded-files" id="uploaded-files" style="display: none;">
                        <!-- Files will be added here dynamically -->
                    </div>
                </div>

                <!-- Contact Options -->
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="contact-me" class="checkbox-input">
                        <label for="contact-me" class="checkbox-label">
                            Contact me about this report if you need more information
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="anonymous" class="checkbox-input">
                        <label for="anonymous" class="checkbox-label">
                            Submit this report anonymously (We won't share your identity with the listing owner)
                        </label>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <div class="footer-note">Reports are confidential</div>
                <div class="footer-actions">
                    <button class="btn btn-secondary">Cancel</button>
                    <button class="btn btn-danger" id="submit-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/>
                            <line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        Submit Report
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Radio button selection styling
        const radioOptions = document.querySelectorAll('.radio-option');
        const radioInputs = document.querySelectorAll('.radio-input');
        const submitBtn = document.getElementById('submit-btn');

        radioInputs.forEach((input, index) => {
            input.addEventListener('change', function() {
                radioOptions.forEach(opt => opt.classList.remove('selected'));
                if (this.checked) {
                    radioOptions[index].classList.add('selected');
                    submitBtn.disabled = false;
                }
            });
        });

        radioOptions.forEach((option, index) => {
            option.addEventListener('click', function() {
                radioInputs[index].checked = true;
                radioInputs[index].dispatchEvent(new Event('change'));
            });
        });

        // File upload handling
        const fileInput = document.getElementById('evidence-upload');
        const uploadedFilesContainer = document.getElementById('uploaded-files');
        let uploadedFiles = [];

        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);

            files.forEach(file => {
                if (file.size <= 10 * 1024 * 1024) { // 10MB limit
                    uploadedFiles.push(file);
                    addFileToUI(file);
                }
            });

            if (uploadedFiles.length > 0) {
                uploadedFilesContainer.style.display = 'flex';
            }
        });

        function addFileToUI(file) {
            const fileEl = document.createElement('div');
            fileEl.className = 'uploaded-file';
            fileEl.innerHTML = `
                <div class="file-icon">📄</div>
                <div class="file-info">
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${formatFileSize(file.size)}</div>
                </div>
                <button class="file-remove" onclick="removeFile(this, '${file.name}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            `;
            uploadedFilesContainer.appendChild(fileEl);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        window.removeFile = function(btn, fileName) {
            uploadedFiles = uploadedFiles.filter(f => f.name !== fileName);
            btn.closest('.uploaded-file').remove();

            if (uploadedFiles.length === 0) {
                uploadedFilesContainer.style.display = 'none';
            }
        };

        // Anonymous checkbox logic
        const anonymousCheck = document.getElementById('anonymous');
        const contactCheck = document.getElementById('contact-me');

        anonymousCheck.addEventListener('change', function() {
            if (this.checked) {
                contactCheck.checked = false;
                contactCheck.disabled = true;
            } else {
                contactCheck.disabled = false;
            }
        });

        // Close modal
        document.querySelector('.modal-close').addEventListener('click', function() {
            document.querySelector('.modal-overlay').style.display = 'none';
        });

        document.querySelector('.btn-secondary').addEventListener('click', function() {
            document.querySelector('.modal-overlay').style.display = 'none';
        });

        // Submit report
        submitBtn.addEventListener('click', function() {
            const selectedReason = document.querySelector('.radio-input:checked');
            if (selectedReason) {
                alert('Report submitted successfully. Our team will review it within 24 hours.');
                document.querySelector('.modal-overlay').style.display = 'none';
            }
        });

        // Close on backdrop click
        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelector('.modal-overlay').style.display = 'none';
            }
        });
    </script>
</body>
</html>
