<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;
            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;
            --color-accent: #10b981;
            --color-accent-bg: #ecfdf5;
            --color-warm: #f59e0b;
            --color-coral: #f43f5e;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, var(--color-snow) 0%, var(--color-cloud) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-midnight);
            padding: 2rem 1rem;
        }

        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 1100px;
            width: 100%;
            background: var(--color-white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(15, 20, 25, 0.1), 0 10px 10px -5px rgba(15, 20, 25, 0.04);
        }

        .login-image {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--color-white);
        }

        .login-image-content {
            max-width: 400px;
        }

        .image-icon {
            font-size: 4rem;
            margin-bottom: 2rem;
            display: block;
        }

        .login-image h2 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .login-image p {
            font-size: 1.125rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-form-section {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            text-align: center;
            display: block;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-midnight);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--color-slate);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            background: var(--color-white);
            border: 2px solid var(--color-cloud);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--color-midnight);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .oauth-btn:hover {
            border-color: var(--color-slate);
            background: var(--color-snow);
        }

        .oauth-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--color-mist);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--color-cloud);
        }

        .divider span {
            padding: 0 1rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--color-midnight);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--color-cloud);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--color-white);
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-bg);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: 400;
            color: var(--color-slate);
            font-size: 0.875rem;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--color-primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary);
            color: var(--color-white);
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
        }

        .submit-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
        }

        .signup-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--color-slate);
        }

        .signup-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 968px) {
            .login-container {
                grid-template-columns: 1fr;
            }

            .login-image {
                display: none;
            }

            .login-form-section {
                padding: 2.5rem 2rem;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            .login-form-section {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.625rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <div class="login-image-content">
                <span class="image-icon">🏠</span>
                <h2>Welcome back to RoomPilot</h2>
                <p>Your next perfect room is waiting. Sign in to continue your search or manage your listings.</p>
            </div>
        </div>

        <div class="login-form-section">
            <a href="landing.html" class="logo">RoomPilot</a>

            <h1>Log in</h1>
            <p class="subtitle">Enter your credentials to access your account</p>

            <div class="oauth-buttons">
                <button class="oauth-btn" onclick="loginWithProvider('google')">
                    <svg class="oauth-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="oauth-btn" onclick="loginWithProvider('apple')">
                    <svg class="oauth-icon" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="currentColor"/>
                    </svg>
                    Continue with Apple
                </button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="form-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="auth-forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="auth-signup.html">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        function loginWithProvider(provider) {
            console.log(`Logging in with ${provider}`);
            alert(`${provider} login would be initiated here`);
        }

        function handleLogin(event) {
            event.preventDefault();

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rememberMe: document.getElementById('rememberMe').checked
            };

            console.log('Login submitted:', formData);

            // Simulate successful login
            alert('Login successful! Redirecting to dashboard...');
            // In real app: window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
