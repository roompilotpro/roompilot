<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Payout | RoomPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-midnight: #0f1419;
            --color-charcoal: #1a2332;
            --color-slate: #3d4f5f;
            --color-mist: #8899a6;
            --color-cloud: #e8ecef;
            --color-snow: #f7f9fa;
            --color-white: #ffffff;

            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-primary-bg: #eff6ff;

            --color-accent: #10b981;
            --color-accent-light: #34d399;
            --color-accent-bg: #ecfdf5;
            --color-accent-dark: #059669;

            --color-warm: #f59e0b;
            --color-warm-bg: #fffbeb;
            --color-coral: #f43f5e;
            --color-coral-bg: #fff1f2;

            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'DM Sans', -apple-system, sans-serif;

            --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 20, 25, 0.08);
            --shadow-lg: 0 12px 40px rgba(15, 20, 25, 0.12);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.5;
            color: var(--color-charcoal);
            background: var(--color-snow);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 25, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Modal Container */
        .modal-container {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal Header */
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 24px 20px;
            border-bottom: 1px solid var(--color-cloud);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            color: var(--color-midnight);
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: none;
            border: none;
            color: var(--color-slate);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--color-snow);
            color: var(--color-charcoal);
        }

        /* Modal Body */
        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        /* Balance Card */
        .balance-card {
            padding: 24px;
            background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-dark) 100%);
            border-radius: var(--radius-lg);
            color: white;
            margin-bottom: 24px;
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .balance-note {
            font-size: 13px;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-charcoal);
            margin-bottom: 8px;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-cloud);
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--color-charcoal);
            background: var(--color-white);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-bg);
        }

        /* Speed Options */
        .speed-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .speed-option {
            padding: 16px;
            background: var(--color-snow);
            border: 2px solid var(--color-cloud);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .speed-option:hover {
            border-color: var(--color-primary);
        }

        .speed-option.selected {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .speed-option-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .speed-radio {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .speed-option-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-charcoal);
            flex: 1;
        }

        .speed-option-badge {
            padding: 4px 10px;
            background: var(--color-accent-bg);
            color: var(--color-accent-dark);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .speed-option-badge.paid {
            background: var(--color-warm-bg);
            color: var(--color-warm);
        }

        .speed-option-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 30px;
        }

        .speed-option-time {
            font-size: 13px;
            color: var(--color-mist);
        }

        .speed-option-fee {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-charcoal);
        }

        /* Summary Section */
        .summary-section {
            padding: 20px;
            background: var(--color-snow);
            border-radius: var(--radius-md);
            margin-bottom: 24px;
        }

        .summary-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-midnight);
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--color-cloud);
        }

        .summary-row:last-child {
            border-bottom: none;
            padding-top: 16px;
            margin-top: 6px;
        }

        .summary-label {
            font-size: 14px;
            color: var(--color-slate);
        }

        .summary-label.total {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-midnight);
        }

        .summary-value {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--color-charcoal);
        }

        .summary-value.fee {
            color: var(--color-coral);
        }

        .summary-value.total {
            font-size: 20px;
            color: var(--color-accent-dark);
        }

        /* Info Note */
        .info-note {
            padding: 16px;
            background: var(--color-primary-bg);
            border-left: 4px solid var(--color-primary);
            border-radius: var(--radius-md);
        }

        .info-note-text {
            font-size: 14px;
            color: var(--color-charcoal);
            line-height: 1.5;
        }

        .info-note-text strong {
            font-weight: 600;
        }

        /* Modal Footer */
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            padding: 20px 24px;
            border-top: 1px solid var(--color-cloud);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: var(--color-snow);
            color: var(--color-slate);
            border: 1px solid var(--color-cloud);
        }

        .btn-secondary:hover {
            background: var(--color-cloud);
            color: var(--color-charcoal);
        }

        .btn-primary {
            background: var(--color-accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-accent-dark);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .modal-container {
                max-width: 100%;
                max-height: 100vh;
                border-radius: 0;
            }

            .balance-amount {
                font-size: 32px;
            }

            .modal-footer {
                flex-direction: column-reverse;
            }

            .modal-footer .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">Request Payout</h2>
                <button class="modal-close" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <!-- Available Balance -->
                <div class="balance-card">
                    <div class="balance-label">Available Balance</div>
                    <div class="balance-amount">$2,340.00</div>
                    <div class="balance-note">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4M12 8h.01"/>
                        </svg>
                        From 7 payments this week
                    </div>
                </div>

                <!-- Bank Account Selector -->
                <div class="form-group">
                    <label class="form-label">Payout to</label>
                    <select class="form-select">
                        <option value="1234">Chase Bank ••••1234 (Default)</option>
                        <option value="5678">Wells Fargo ••••5678</option>
                    </select>
                </div>

                <!-- Payout Speed -->
                <div class="form-group">
                    <label class="form-label">Payout Speed</label>
                    <div class="speed-options">
                        <!-- Standard -->
                        <label class="speed-option selected">
                            <div class="speed-option-header">
                                <input type="radio" name="speed" value="standard" class="speed-radio" checked>
                                <span class="speed-option-title">Standard</span>
                                <span class="speed-option-badge">Free</span>
                            </div>
                            <div class="speed-option-details">
                                <span class="speed-option-time">1-2 business days</span>
                                <span class="speed-option-fee">$0.00</span>
                            </div>
                        </label>

                        <!-- Instant -->
                        <label class="speed-option">
                            <div class="speed-option-header">
                                <input type="radio" name="speed" value="instant" class="speed-radio">
                                <span class="speed-option-title">Instant</span>
                                <span class="speed-option-badge paid">1% Fee</span>
                            </div>
                            <div class="speed-option-details">
                                <span class="speed-option-time">Arrives in minutes</span>
                                <span class="speed-option-fee">$23.40</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Summary -->
                <div class="summary-section">
                    <div class="summary-title">Payout Summary</div>
                    <div class="summary-row">
                        <span class="summary-label">Available balance</span>
                        <span class="summary-value">$2,340.00</span>
                    </div>
                    <div class="summary-row" id="fee-row" style="display: none;">
                        <span class="summary-label">Instant payout fee (1%)</span>
                        <span class="summary-value fee">-$23.40</span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label total">You'll receive</span>
                        <span class="summary-value total" id="net-amount">$2,340.00</span>
                    </div>
                </div>

                <!-- Info Note -->
                <div class="info-note">
                    <p class="info-note-text">
                        <strong>Next automatic payout:</strong> Tomorrow (December 2, 2024) at 5:00 PM EST.
                        Automatic payouts are free and arrive in 1-2 business days.
                    </p>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary">Cancel</button>
                <button class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
                    </svg>
                    Request Payout
                </button>
            </div>
        </div>
    </div>

    <script>
        const availableBalance = 2340.00;
        const speedOptions = document.querySelectorAll('.speed-option');
        const speedRadios = document.querySelectorAll('.speed-radio');
        const feeRow = document.getElementById('fee-row');
        const netAmount = document.getElementById('net-amount');

        // Speed option selection
        speedRadios.forEach((radio, index) => {
            radio.addEventListener('change', function() {
                speedOptions.forEach(opt => opt.classList.remove('selected'));
                if (this.checked) {
                    speedOptions[index].classList.add('selected');
                    updateSummary(this.value);
                }
            });
        });

        speedOptions.forEach((option, index) => {
            option.addEventListener('click', function(e) {
                if (e.target !== speedRadios[index]) {
                    speedRadios[index].checked = true;
                    speedRadios[index].dispatchEvent(new Event('change'));
                }
            });
        });

        // Update summary based on speed selection
        function updateSummary(speed) {
            if (speed === 'instant') {
                const fee = availableBalance * 0.01;
                const net = availableBalance - fee;
                feeRow.style.display = 'flex';
                netAmount.textContent = `$${net.toFixed(2)}`;
            } else {
                feeRow.style.display = 'none';
                netAmount.textContent = `$${availableBalance.toFixed(2)}`;
            }
        }

        // Request payout
        document.querySelector('.btn-primary').addEventListener('click', function() {
            const selectedSpeed = document.querySelector('.speed-radio:checked').value;
            const speedText = selectedSpeed === 'instant' ? 'instant' : 'standard (1-2 business days)';
            const amount = netAmount.textContent;

            if (confirm(`Request ${speedText} payout of ${amount}?`)) {
                alert('Payout requested successfully! You will receive a confirmation email shortly.');
                document.querySelector('.modal-overlay').style.display = 'none';
            }
        });

        // Close modal
        document.querySelector('.modal-close').addEventListener('click', function() {
            document.querySelector('.modal-overlay').style.display = 'none';
        });

        document.querySelector('.btn-secondary').addEventListener('click', function() {
            document.querySelector('.modal-overlay').style.display = 'none';
        });

        // Close on backdrop click
        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.style.display = 'none';
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelector('.modal-overlay').style.display = 'none';
            }
        });
    </script>
</body>
</html>
