name: CI - Lint, Test & Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'feature/**'
      - 'bugfix/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Test & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Checkstyle Code Style Check
        run: ./mvnw -B -ntp checkstyle:check

      - name: Compile (no tests)
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Run Unit Tests with Coverage
        run: ./mvnw -B -ntp test

      - name: SpotBugs Static Analysis
        run: ./mvnw -B -ntp spotbugs:check

      - name: Code Formatting Check
        run: ./mvnw -B -ntp spotless:check

      - name: Generate JaCoCo Coverage Report
        run: ./mvnw -B -ntp jacoco:report

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend - Test, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Prettier Format Check
        run: npm run format:check

      - name: Run Unit Tests
        run: npm run test

      - name: Generate Coverage Report
        run: npm run test:coverage

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage-node-20
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  coverage-report:
    name: Generate Coverage Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-reports
          path: backend-coverage

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-results
          path: frontend-coverage

      - name: Comment Coverage on PR
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Check Job Status
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ Quality gate failed - one or more jobs failed"
            exit 1
          fi
          echo "✅ All quality checks passed"
