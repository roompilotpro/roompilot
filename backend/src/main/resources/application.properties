# Application
spring.application.name=roompilot-api
server.port=8080

# Database - Neon Postgres
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate - DO NOT use ddl-auto in production, use Flyway instead
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=when-authorized

# JWT Configuration
jwt.secret=${JWT_SECRET:YourDefaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction}
jwt.expiration-ms=604800000
jwt.refresh-expiration-ms=2592000000

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/google/callback

# Admin Email Whitelist (comma-separated)
admin.emails=${ADMIN_EMAILS:}

# Development Configuration
app.environment=${ENVIRONMENT:production}
app.enable-dev-auth=${ENABLE_DEV_AUTH:false}